# /etc/nginx/sites-available/employee-api
# Replace the server_name with the DNS name of the VM.
# certbot adds the HTTPS (443) block and the HTTP -> HTTPS redirect to this file.

server {
    listen 80;
    server_name employee-api-kb2611.centralindia.cloudapp.azure.com;

    client_max_body_size 6M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
